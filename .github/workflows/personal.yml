# SPDX-License-Identifier: GPL-3.0-or-later
# Fork only: a build for personal use, from whichever branch it's run on
# (Actions > Personal build > Run workflow > pick the branch). Just the Android
# app and the macOS one, as artifacts: no release, no feed, no checks on the
# other platforms. The phone app is signed with the key in ANDROID_KEYSTORE,
# the Mac app with an Apple Development certificate and profile when
# APPLE_DEV_* are set (needed for the virtual camera), else ad-hoc. Neither is
# notarized: `xattr -cr` the app after downloading it.
name: Personal build

on:
  workflow_dispatch:
    inputs:
      android:
        description: "Build the Android app"
        type: boolean
        default: true
      macos:
        description: "Build the macOS app (Apple silicon)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  android:
    name: Android app (signed)
    if: inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain and the Android target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: personal-android
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "16111833"
          packages: "platforms;android-37.0 ndk;30.0.16248370 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::the ANDROID_KEYSTORE secret isn't set"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        working-directory: android
        env:
          NECTARLINK_KEYSTORE: ${{ runner.temp }}/release.jks
          NECTARLINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -Pnectarlink.abis=arm64-v8a
      - name: Check the signature, and name the app
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p out
          cp "$apk" "out/Nectarlink-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}-android.apk"
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk
          retention-days: 30

  macos:
    name: macOS DMG (Apple silicon)
    if: inputs.macos
    runs-on: macos-latest
    env:
      APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
      APPLE_DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
      APPLE_DEV_PROFILE: ${{ secrets.APPLE_DEV_PROFILE }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: personal-macos-arm64
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
      # The phone-as-webcam camera extension only installs from an app signed
      # with a certificate and a provisioning profile that carry the System
      # Extension entitlement. An Apple Development certificate and its
      # profile do for a Mac registered in the profile (no notarization).
      # Without the three secrets the DMG is ad-hoc signed: no virtual camera.
      - name: Import the signing certificate and profile
        if: env.APPLE_DEV_CERT_P12 != '' && env.APPLE_DEV_PROFILE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$APPLE_DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_DEV_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$APPLE_DEV_PROFILE" | base64 --decode > "$RUNNER_TEMP/host.provisionprofile"
          # The app must be signed with a certificate the profile lists, or
          # macOS kills it at launch: take the identity whose SHA-1 is one of
          # the profile's.
          security cms -D -i "$RUNNER_TEMP/host.provisionprofile" > "$RUNNER_TEMP/profile.plist"
          count=$(plutil -extract DeveloperCertificates raw "$RUNNER_TEMP/profile.plist")
          identities=$(security find-identity -v -p codesigning "$keychain")
          identity=""
          for i in $(seq 0 $((count - 1))); do
            sha=$(plutil -extract "DeveloperCertificates.$i" raw "$RUNNER_TEMP/profile.plist" | base64 --decode \
              | openssl x509 -inform der -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
            if printf '%s\n' "$identities" | grep -q "$sha"; then identity="$sha"; break; fi
          done
          if [ -z "$identity" ]; then
            echo "::error::the certificate in APPLE_DEV_CERT_P12 isn't one the provisioning profile was made for. It holds:"
            printf '%s\n' "$identities"
            exit 1
          fi
          echo "Signing with $(printf '%s\n' "$identities" | grep "$identity")"
          {
            echo "SIGN_IDENTITY=$identity"
            echo "KEYCHAIN_PATH=$keychain"
            echo "HOST_PROVISIONING_PROFILE=$RUNNER_TEMP/host.provisionprofile"
            echo "REQUIRE_VCAM=1"
          } >> "$GITHUB_ENV"
      - name: Build and package the DMG
        run: ARCH=arm64 bash desktop/packaging/macos/build-dmg.sh
      - name: Remove the signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/host.provisionprofile" "$RUNNER_TEMP/profile.plist"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          retention-days: 30
